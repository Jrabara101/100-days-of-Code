<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

// ============================================================================
// 1. SOUND SYNTHESIZER (Web Audio API - Headless Audio Feedback)
// ============================================================================
class AudioController {
    constructor() {
        this.ctx = null;
        this.muted = false;
    }

    init() {
        if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) {
                this.ctx = new AudioCtx();
            }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
        }
    }

    playTone(freq, type = 'sine', duration = 0.12, gainLevel = 0.1) {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        try {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
            
            gain.gain.setValueAtTime(gainLevel, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);

            osc.connect(gain);
            gain.connect(this.ctx.destination);

            osc.start();
            osc.stop(this.ctx.currentTime + duration);
        } catch (e) {
            console.warn('Audio play error:', e);
        }
    }

    playCorrectGuess() {
        if (this.muted) return;
        this.init();
        // Ascending major chord fanfare: C5, E5, G5, C6
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, i) => {
            setTimeout(() => this.playTone(freq, 'triangle', 0.2, 0.15), i * 75);
        });
    }

    playCloseHint() {
        if (this.muted) return;
        this.init();
        // Double blip warning
        this.playTone(440, 'sine', 0.08, 0.12);
        setTimeout(() => this.playTone(554.37, 'sine', 0.1, 0.12), 90);
    }

    playTick() {
        if (this.muted) return;
        this.playTone(880, 'sine', 0.04, 0.05);
    }

    playRoundStart() {
        if (this.muted) return;
        this.init();
        const notes = [440, 554.37, 659.25];
        notes.forEach((freq, i) => {
            setTimeout(() => this.playTone(freq, 'sine', 0.15, 0.1), i * 90);
        });
    }

    playStrokeStart() {
        if (this.muted) return;
        this.playTone(220, 'sine', 0.02, 0.02);
    }
}

const audioFX = new AudioController();

// ============================================================================
// 2. MATHEMATICAL VECTOR FORMULATIONS: LEVENSHTEIN, RDP & SPLINES
// ============================================================================

/**
 * 1. Levenshtein Dynamic Programming Metric
 * D(i, j) for fuzzy guess proximity detection
 */
function getLevenshteinDistance(a, b) {
    const s1 = a.toLowerCase().trim();
    const s2 = b.toLowerCase().trim();
    const m = s1.length, n = s2.length;
    const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));

    for (let i = 0; i <= m; i++) dp[i][0] = i;
    for (let j = 0; j <= n; j++) dp[0][j] = j;

    for (let i = 1; i <= m; i++) {
        for (let j = 1; j <= n; j++) {
            if (s1[i - 1] === s2[j - 1]) {
                dp[i][j] = dp[i - 1][j - 1];
            } else {
                dp[i][j] = 1 + Math.min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1]);
            }
        }
    }
    return dp[m][n];
}

/**
 * 2. Ramer-Douglas-Peucker (RDP) Polyline Simplifier
 * Distance delta formulation: |(yB - yA)xP - (xB - xA)yP + xB yA - yB xA| / hypot(dx, dy)
 */
function getPerpendicularDistance(p, p1, p2) {
    const dx = p2.x - p1.x;
    const dy = p2.y - p1.y;
    if (dx === 0 && dy === 0) {
        return Math.hypot(p.x - p1.x, p.y - p1.y);
    }
    const num = Math.abs(dy * p.x - dx * p.y + p2.x * p1.y - p2.y * p1.x);
    const den = Math.hypot(dx, dy);
    return num / den;
}

function simplifyRDP(points, epsilon = 1.2) {
    if (!points || points.length <= 2) return points;
    let maxDist = 0;
    let index = 0;
    const end = points.length - 1;

    for (let i = 1; i < end; i++) {
        const d = getPerpendicularDistance(points[i], points[0], points[end]);
        if (d > maxDist) {
            maxDist = d;
            index = i;
        }
    }

    if (maxDist > epsilon) {
        const left = simplifyRDP(points.slice(0, index + 1), epsilon);
        const right = simplifyRDP(points.slice(index), epsilon);
        return left.slice(0, left.length - 1).concat(right);
    } else {
        return [points[0], points[end]];
    }
}

/**
 * Quantize point coords to 1 decimal place to save packet footprint
 */
function quantizePoint(p) {
    return {
        x: Math.round(p.x * 10) / 10,
        y: Math.round(p.y * 10) / 10
    };
}

// ============================================================================
// 3. HEADLESS SHARED WHITEBOARD & GAMEPLAY ENGINE
// ============================================================================
const WORD_VAULT = [
    { word: 'ROCKET', hint: 'Travels to space', category: 'Technology' },
    { word: 'PIZZA', hint: 'Cheesy Italian slice', category: 'Food' },
    { word: 'GUITAR', hint: 'Six-stringed acoustic instrument', category: 'Music' },
    { word: 'DRAGON', hint: 'Mythical fire breather', category: 'Fantasy' },
    { word: 'CASTLE', hint: 'Fortified medieval royal palace', category: 'Architecture' },
    { word: 'PENGUIN', hint: 'Flightless Antarctic bird', category: 'Animals' },
    { word: 'CAMPFIRE', hint: 'Outdoor wood flame for roasting', category: 'Nature' },
    { word: 'VOLCANO', hint: 'Spews lava and ash', category: 'Nature' },
    { word: 'AIRPLANE', hint: 'Wings in the clouds', category: 'Vehicle' },
    { word: 'TELESCOPE', hint: 'Views distant galaxies and stars', category: 'Science' },
    { word: 'SUBMARINE', hint: 'Undersea naval vessel', category: 'Vehicle' },
    { word: 'DIAMOND', hint: 'Hardest sparkling gemstone', category: 'Minerals' },
    { word: 'OCTOPUS', hint: 'Eight tentacled sea creature', category: 'Animals' },
    { word: 'LIGHTHOUSE', hint: 'Beams light for ships in fog', category: 'Building' }
];

class WhiteboardGameEngine {
    constructor(userId, username, onUpdate) {
        this.userId = userId;
        this.username = username;
        this.width = 800;
        this.height = 520;
        this.onUpdate = onUpdate;

        // Directory of Peers
        this.peers = new Map();
        this.peers.set(this.userId, {
            id: this.userId,
            username: this.username,
            score: 0,
            hasGuessed: false,
            color: '#38bdf8',
            avatar: '🚀'
        });

        // Vector Canvas History
        this.strokes = []; // Array of { id, color, size, points: [{x,y}], isEraser }
        this.currentStroke = null;
        this.remoteCursors = new Map(); // id -> { x, y, username, color, isDrawing }

        // Game State Machine: 'LOBBY' | 'SELECTING_WORD' | 'DRAWING' | 'REVEAL'
        this.gameState = 'LOBBY';
        this.currentDrawerId = null;
        this.secretWord = '';
        this.secretCategory = '';
        this.secretHint = '';
        this.currentChoices = [];
        this.roundTimer = 0;
        this.roundDuration = 60;
        this.timerInterval = null;
        this.autoStartTimer = null;

        // Active Drawing Settings
        this.brushColor = '#0f172a';
        this.brushSize = 5;
        this.isEraser = false;

        // Multi-tab Broadcast Channel
        this.channelName = 'whiteboard_arena_v2_channel';
        this.bus = new BroadcastChannel(this.channelName);
        this.setupNetworkHandlers();
        
        // Announce presence immediately
        setTimeout(() => this.announcePresence(), 100);
    }

    setupNetworkHandlers() {
        this.bus.onmessage = (event) => {
            const { type, payload, senderId } = event.data;
            if (senderId === this.userId) return; // Ignore echoes

            switch (type) {
                case 'USER_ANNOUNCE':
                    if (!this.peers.has(payload.id)) {
                        this.peers.set(payload.id, {
                            id: payload.id,
                            username: payload.username,
                            score: payload.score || 0,
                            hasGuessed: payload.hasGuessed || false,
                            color: payload.color || '#a855f7',
                            avatar: payload.avatar || '🎨'
                        });
                        // Reply with our presence so newcomer knows us
                        this.announcePresence();
                        this.triggerUpdate();
                    }
                    break;

                case 'CURSOR_STREAM':
                    this.remoteCursors.set(payload.id, {
                        x: payload.x,
                        y: payload.y,
                        username: payload.username,
                        color: payload.color,
                        isDrawing: payload.isDrawing
                    });
                    break;

                case 'STROKE_START':
                    this.currentStroke = {
                        id: payload.strokeId,
                        color: payload.color,
                        size: payload.size,
                        isEraser: payload.isEraser,
                        points: [payload.point]
                    };
                    break;

                case 'STROKE_CHUNK':
                    if (this.currentStroke) {
                        this.currentStroke.points.push(payload.point);
                    }
                    break;

                case 'STROKE_END':
                    if (this.currentStroke) {
                        // Apply Ramer-Douglas-Peucker compression on commit
                        const simplified = simplifyRDP(this.currentStroke.points, 1.2);
                        this.strokes.push({
                            ...this.currentStroke,
                            points: simplified
                        });
                        this.currentStroke = null;
                        this.triggerUpdate();
                    }
                    break;

                case 'UNDO_STROKE':
                    if (this.strokes.length > 0) {
                        this.strokes.pop();
                        this.triggerUpdate();
                    }
                    break;

                case 'CLEAR_CANVAS':
                    this.strokes = [];
                    this.currentStroke = null;
                    this.triggerUpdate();
                    break;

                case 'GAME_STATE_SYNC':
                    this.gameState = payload.gameState;
                    this.currentDrawerId = payload.currentDrawerId;
                    this.roundTimer = payload.roundTimer;
                    this.secretWord = payload.secretWord;
                    this.secretCategory = payload.secretCategory;
                    this.secretHint = payload.secretHint;
                    if (payload.peers) {
                        this.peers = new Map(payload.peers);
                    }
                    if (payload.strokes) {
                        this.strokes = payload.strokes;
                    }
                    this.triggerUpdate();
                    break;

                case 'BROADCAST_CHAT':
                    if (payload.msg) {
                        if (this.onChatMessage) {
                            this.onChatMessage(payload.msg);
                        }
                    }
                    break;
            }
        };
    }

    announcePresence() {
        const self = this.peers.get(this.userId);
        this.bus.postMessage({
            type: 'USER_ANNOUNCE',
            senderId: this.userId,
            payload: self
        });
    }

    triggerUpdate() {
        if (this.onUpdate) this.onUpdate();
    }

    // --- VECTOR DRAWING PIPELINE ---
    startStroke(x, y) {
        if (this.gameState === 'DRAWING' && this.currentDrawerId !== this.userId) return;

        const color = this.isEraser ? '#ffffff' : this.brushColor;
        const qPoint = quantizePoint({ x, y });
        const strokeId = 'strk_' + Date.now() + '_' + Math.floor(Math.random() * 999);

        this.currentStroke = {
            id: strokeId,
            color,
            size: this.brushSize,
            isEraser: this.isEraser,
            points: [qPoint]
        };

        audioFX.playStrokeStart();

        this.bus.postMessage({
            type: 'STROKE_START',
            senderId: this.userId,
            payload: {
                strokeId,
                color,
                size: this.brushSize,
                isEraser: this.isEraser,
                point: qPoint
            }
        });
    }

    continueStroke(x, y) {
        if (!this.currentStroke) return;

        const qPoint = quantizePoint({ x, y });
        const pts = this.currentStroke.points;
        const last = pts[pts.length - 1];

        // Delta-distance gating: avoid adding collinear 0-delta points
        if (last && Math.hypot(qPoint.x - last.x, qPoint.y - last.y) < 1.5) {
            return;
        }

        pts.push(qPoint);

        this.bus.postMessage({
            type: 'STROKE_CHUNK',
            senderId: this.userId,
            payload: { point: qPoint }
        });
    }

    endStroke() {
        if (!this.currentStroke) return;

        // Apply RDP simplification prior to committing to static memory buffer
        const compressed = simplifyRDP(this.currentStroke.points, 1.2);
        this.strokes.push({
            ...this.currentStroke,
            points: compressed
        });
        this.currentStroke = null;

        this.bus.postMessage({
            type: 'STROKE_END',
            senderId: this.userId,
            payload: {}
        });

        this.triggerUpdate();
    }

    undoLastStroke() {
        if (this.gameState === 'DRAWING' && this.currentDrawerId !== this.userId) return;
        if (this.strokes.length === 0) return;

        this.strokes.pop();
        this.bus.postMessage({
            type: 'UNDO_STROKE',
            senderId: this.userId,
            payload: {}
        });
        this.triggerUpdate();
    }

    clearBoard() {
        if (this.gameState === 'DRAWING' && this.currentDrawerId !== this.userId) return;

        this.strokes = [];
        this.currentStroke = null;
        this.bus.postMessage({
            type: 'CLEAR_CANVAS',
            senderId: this.userId,
            payload: {}
        });
        this.triggerUpdate();
    }

    sendCursor(x, y, isDrawing = false) {
        const self = this.peers.get(this.userId);
        this.bus.postMessage({
            type: 'CURSOR_STREAM',
            senderId: this.userId,
            payload: {
                id: this.userId,
                username: this.username,
                color: self?.color || '#38bdf8',
                x: Math.round(x),
                y: Math.round(y),
                isDrawing
            }
        });
    }

    // --- GAMEPLAY FSM & ROUND FLOW ---
    startNewGame() {
        const peerKeys = Array.from(this.peers.keys());
        if (peerKeys.length === 0) return;

        // Pick next drawer or random
        this.currentDrawerId = peerKeys[Math.floor(Math.random() * peerKeys.length)];
        this.gameState = 'SELECTING_WORD';
        
        // Randomize 3 choices from vault
        const shuffled = [...WORD_VAULT].sort(() => Math.random() - 0.5);
        this.currentChoices = shuffled.slice(0, 3);
        this.strokes = [];
        this.currentStroke = null;

        // Reset guessed flags
        this.peers.forEach(p => p.hasGuessed = false);

        this.syncGameState();
        this.triggerUpdate();
    }

    selectWord(choice) {
        this.secretWord = choice.word;
        this.secretCategory = choice.category;
        this.secretHint = choice.hint;
        this.gameState = 'DRAWING';
        this.roundTimer = this.roundDuration;
        this.peers.forEach(p => p.hasGuessed = false);

        audioFX.playRoundStart();

        if (this.timerInterval) clearInterval(this.timerInterval);
        this.timerInterval = setInterval(() => {
            this.roundTimer--;
            if (this.roundTimer === 10 || this.roundTimer === 5) {
                audioFX.playTick();
            }
            if (this.roundTimer <= 0) {
                this.endRound();
            }
            this.syncGameState();
            this.triggerUpdate();
        }, 1000);

        this.syncGameState();
        this.triggerUpdate();
    }

    evaluateGuess(guessText, guesserId) {
        if (this.gameState !== 'DRAWING') return { type: 'NORMAL' };
        if (guesserId === this.currentDrawerId) return { type: 'DRAWER_CHAT' };

        const cleanGuess = guessText.trim().toUpperCase();
        const target = this.secretWord.toUpperCase();

        const peer = this.peers.get(guesserId);
        if (!peer) return { type: 'NORMAL' };

        // Already guessed
        if (peer.hasGuessed) {
            return { type: 'ALREADY_GUESSED' };
        }

        // Exact Match
        if (cleanGuess === target) {
            peer.hasGuessed = true;
            const pointsEarned = 100 + Math.max(0, this.roundTimer) * 5;
            peer.score += pointsEarned;

            // Drawer bonus points
            const drawer = this.peers.get(this.currentDrawerId);
            if (drawer) {
                drawer.score += 40;
            }

            audioFX.playCorrectGuess();

            // Trigger confetti
            if (window.confetti) {
                window.confetti({
                    particleCount: 80,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            }

            // Check if all active non-drawer guessers have solved it
            const guessers = Array.from(this.peers.values()).filter(p => p.id !== this.currentDrawerId);
            if (guessers.length > 0 && guessers.every(g => g.hasGuessed)) {
                this.endRound();
            }

            this.syncGameState();
            this.triggerUpdate();

            return {
                type: 'CORRECT',
                username: peer.username,
                points: pointsEarned
            };
        }

        // Fuzzy Levenshtein Distance Check (1 edit away and word length >= 4)
        const dist = getLevenshteinDistance(cleanGuess, target);
        if (dist === 1 && target.length >= 4) {
            audioFX.playCloseHint();
            return { type: 'CLOSE' };
        }

        return { type: 'NORMAL' };
    }

    endRound() {
        if (this.timerInterval) clearInterval(this.timerInterval);
        this.gameState = 'REVEAL';
        this.syncGameState();
        this.triggerUpdate();

        // 5s reveal countdown then next round
        if (this.autoStartTimer) clearTimeout(this.autoStartTimer);
        this.autoStartTimer = setTimeout(() => {
            this.startNewGame();
        }, 5000);
    }

    broadcastChatMessage(msg) {
        this.bus.postMessage({
            type: 'BROADCAST_CHAT',
            senderId: this.userId,
            payload: { msg }
        });
    }

    syncGameState() {
        this.bus.postMessage({
            type: 'GAME_STATE_SYNC',
            senderId: this.userId,
            payload: {
                gameState: this.gameState,
                currentDrawerId: this.currentDrawerId,
                roundTimer: this.roundTimer,
                secretWord: this.secretWord,
                secretCategory: this.secretCategory,
                secretHint: this.secretHint,
                peers: Array.from(this.peers.entries()),
                strokes: this.strokes
            }
        });
    }
}

// 4. REACT APPLICATION HUD & CANVAS PIPELINE
// ============================================================================
const COLOR_PALETTE = [
    { name: 'Pitch Dark', hex: '#0f172a' },
    { name: 'Crimson', hex: '#ef4444' },
    { name: 'Amber Glow', hex: '#f59e0b' },
    { name: 'Emerald', hex: '#10b981' },
    { name: 'Sky Cyan', hex: '#0ea5e9' },
    { name: 'Indigo', hex: '#6366f1' },
    { name: 'Purple', hex: '#a855f7' },
    { name: 'Hot Pink', hex: '#ec4899' },
    { name: 'Coffee', hex: '#78350f' },
    { name: 'Cloud White', hex: '#ffffff' }
];

const BRUSH_SIZES = [
    { label: 'Fine', size: 2, icon: 'edit' },
    { label: 'Medium', size: 5, icon: 'brush' },
    { label: 'Bold', size: 10, icon: 'draw' },
    { label: 'Chunky', size: 18, icon: 'line_weight' }
];

function SharedWhiteboardApp() {
    // Persistent User Identity in local storage
    const [userId] = useState(() => {
        const saved = sessionStorage.getItem('wb_user_id');
        if (saved) return saved;
        const fresh = 'u_' + Math.floor(Math.random() * 89999 + 10000);
        sessionStorage.setItem('wb_user_id', fresh);
        return fresh;
    });

    const [username, setUsername] = useState(() => {
        const saved = sessionStorage.getItem('wb_username');
        if (saved) return saved;
        const avatars = ['Artist', 'Doodler', 'Picasso', 'Sketcher', 'InkMaster', 'PixelNinja'];
        const chosen = avatars[Math.floor(Math.random() * avatars.length)] + '_' + Math.floor(Math.random() * 89 + 10);
        sessionStorage.setItem('wb_username', chosen);
        return chosen;
    });

    const [, setTick] = useState(0);
    const forceRerender = useCallback(() => setTick(t => t + 1), []);

    // Instantiate Engine
    const engineRef = useRef(null);
    if (!engineRef.current) {
        engineRef.current = new WhiteboardGameEngine(userId, username, forceRerender);
    }
    const engine = engineRef.current;

    // React Component States
    const [messages, setMessages] = useState([
        { id: 1, user: 'SYSTEM', text: 'Welcome to Whiteboard Arena! Open multiple browser tabs to test multiplayer sync.', isSystem: true }
    ]);
    const [chatInput, setChatInput] = useState('');
    const [selectedColor, setSelectedColor] = useState('#0f172a');
    const [brushSize, setBrushSize] = useState(5);
    const [isEraser, setIsEraser] = useState(false);
    const [isMuted, setIsMuted] = useState(false);
    const [showSettings, setShowSettings] = useState(false);
    const [customNameInput, setCustomNameInput] = useState(username);

    const isDrawingRef = useRef(false);
    const messagesEndRef = useRef(null);
    const committedCanvasRef = useRef(null);
    const activeCanvasRef = useRef(null);

    // Auto-scroll chat log
    useEffect(() => {
        messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
    }, [messages]);

    // Handle peer messages
    useEffect(() => {
        engine.onChatMessage = (msg) => {
            setMessages(prev => [...prev.slice(-40), msg]);
        };
    }, [engine]);

    // Draw Smooth Midpoint Bézier Splines ($C^1$ Continuity)
    const drawSplineStroke = useCallback((ctx, stroke) => {
        const pts = stroke.points;
        if (!pts || pts.length === 0) return;

        ctx.save();
        ctx.strokeStyle = stroke.color;
        ctx.lineWidth = stroke.size;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        if (pts.length === 1) {
            ctx.fillStyle = stroke.color;
            ctx.beginPath();
            ctx.arc(pts[0].x, pts[0].y, stroke.size / 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
            return;
        }

        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);

        for (let i = 1; i < pts.length - 1; i++) {
            const midX = (pts[i].x + pts[i + 1].x) / 2;
            const midY = (pts[i].y + pts[i + 1].y) / 2;
            ctx.quadraticCurveTo(pts[i].x, pts[i].y, midX, midY);
        }

        // Connect to the final endpoint
        ctx.lineTo(pts[pts.length - 1].x, pts[pts.length - 1].y);
        ctx.stroke();
        ctx.restore();
    }, []);

    // 60 FPS Dual-Layer Canvas Compositor Engine
    useEffect(() => {
        const committed = committedCanvasRef.current;
        const active = activeCanvasRef.current;
        if (!committed || !active) return;

        const cCtx = committed.getContext('2d');
        const aCtx = active.getContext('2d');

        let animFrame;
        let lastStrokeCount = -1;

        const renderLoop = () => {
            // 1. LAYER 2: COMMITTED STATIC STROKES (Redraw only when strokes mutate)
            if (lastStrokeCount !== engine.strokes.length) {
                lastStrokeCount = engine.strokes.length;
                cCtx.fillStyle = '#ffffff';
                cCtx.fillRect(0, 0, engine.width, engine.height);

                // Grid background watermark
                cCtx.strokeStyle = 'rgba(15, 23, 42, 0.04)';
                cCtx.lineWidth = 1;
                for (let x = 20; x < engine.width; x += 20) {
                    cCtx.beginPath();
                    cCtx.moveTo(x, 0);
                    cCtx.lineTo(x, engine.height);
                    cCtx.stroke();
                }
                for (let y = 20; y < engine.height; y += 20) {
                    cCtx.beginPath();
                    cCtx.moveTo(0, y);
                    cCtx.lineTo(engine.width, y);
                    cCtx.stroke();
                }

                engine.strokes.forEach(stroke => {
                    drawSplineStroke(cCtx, stroke);
                });
            }

            // 2. LAYER 1: EPHEMERAL ACTIVE IN-FLIGHT STROKE & REMOTE GHOST CURSORS
            aCtx.clearRect(0, 0, engine.width, engine.height);

            // Active in-flight stroke
            if (engine.currentStroke) {
                drawSplineStroke(aCtx, engine.currentStroke);
            }

            // Remote Ghost Cursors
            engine.remoteCursors.forEach((c, id) => {
                if (id !== engine.userId) {
                    aCtx.save();
                    // Glow ring
                    aCtx.shadowBlur = 8;
                    aCtx.shadowColor = c.color || '#38bdf8';
                    aCtx.fillStyle = c.color || '#38bdf8';

                    // Cursor Dot / Pencil pointer
                    aCtx.beginPath();
                    aCtx.arc(c.x, c.y, 4, 0, Math.PI * 2);
                    aCtx.fill();

                    // Cursor Tag Badge
                    aCtx.font = '600 10px "JetBrains Mono", monospace';
                    const tagText = `${c.username || 'Peer'}${c.isDrawing ? ' ✎' : ''}`;
                    const metrics = aCtx.measureText(tagText);
                    const tagW = metrics.width + 10;
                    const tagH = 16;
                    const tagX = c.x + 8;
                    const tagY = c.y - 8;

                    aCtx.fillStyle = 'rgba(11, 19, 38, 0.85)';
                    aCtx.strokeStyle = c.color || '#38bdf8';
                    aCtx.lineWidth = 1;
                    aCtx.beginPath();
                    aCtx.roundRect(tagX, tagY - tagH + 4, tagW, tagH, 4);
                    aCtx.fill();
                    aCtx.stroke();

                    aCtx.fillStyle = '#ffffff';
                    aCtx.fillText(tagText, tagX + 5, tagY);
                    aCtx.restore();
                }
            });

            animFrame = requestAnimationFrame(renderLoop);
        };

        animFrame = requestAnimationFrame(renderLoop);
        return () => cancelAnimationFrame(animFrame);
    }, [engine, drawSplineStroke]);

    // Canvas Pointer Coordinates Transformer
    const getCanvasCoordinates = (e) => {
        const rect = activeCanvasRef.current.getBoundingClientRect();
        const scaleX = engine.width / rect.width;
        const scaleY = engine.height / rect.height;
        return {
            x: (e.clientX - rect.left) * scaleX,
            y: (e.clientY - rect.top) * scaleY
        };
    };

    const handlePointerDown = (e) => {
        if (e.button !== 0) return; // Left click only
        const { x, y } = getCanvasCoordinates(e);
        isDrawingRef.current = true;
        engine.startStroke(x, y);
        engine.sendCursor(x, y, true);
    };

    const handlePointerMove = (e) => {
        const { x, y } = getCanvasCoordinates(e);
        engine.sendCursor(x, y, isDrawingRef.current);

        if (isDrawingRef.current) {
            engine.continueStroke(x, y);
        }
    };

    const handlePointerUp = () => {
        if (isDrawingRef.current) {
            isDrawingRef.current = false;
            engine.endStroke();
            const { x, y } = engine.remoteCursors.get(userId) || { x: 0, y: 0 };
            engine.sendCursor(x, y, false);
        }
    };

    // Chat / Guess Submission
    const handleChatSubmit = (e) => {
        e.preventDefault();
        const text = chatInput.trim();
        if (!text) return;

        const isMeDrawer = engine.currentDrawerId === userId;
        const result = engine.evaluateGuess(text, userId);

        let newMsg = null;

        if (result.type === 'CORRECT') {
            newMsg = {
                id: Date.now() + Math.random(),
                user: 'SYSTEM',
                text: `🎉 ${result.username} correctly guessed the secret word (+${result.points} pts)!`,
                isSystem: true,
                isCorrect: true
            };
            engine.broadcastChatMessage(newMsg);
        } else if (result.type === 'CLOSE') {
            // Private isolated tip to user
            newMsg = {
                id: Date.now() + Math.random(),
                user: 'SYSTEM',
                text: `⚠️ "${text}" is very close! Check your spelling.`,
                isSystem: true,
                isClose: true
            };
        } else if (result.type === 'DRAWER_CHAT') {
            newMsg = {
                id: Date.now() + Math.random(),
                user: username,
                text: text,
                isDrawer: true
            };
            engine.broadcastChatMessage(newMsg);
        } else if (result.type === 'ALREADY_GUESSED') {
            newMsg = {
                id: Date.now() + Math.random(),
                user: username,
                text: `(Guessed) ${text}`,
                isMutedGuess: true
            };
            engine.broadcastChatMessage(newMsg);
        } else {
            newMsg = {
                id: Date.now() + Math.random(),
                user: username,
                text: text
            };
            engine.broadcastChatMessage(newMsg);
        }

        if (newMsg) {
            setMessages(prev => [...prev.slice(-40), newMsg]);
        }
        setChatInput('');
    };

    const isMeDrawer = engine.currentDrawerId === userId;
    const peerList = Array.from(engine.peers.values()).sort((a, b) => b.score - a.score);

    // Formatted Word Mask
    const wordDisplay = useMemo(() => {
        if (engine.gameState === 'DRAWING') {
            if (isMeDrawer) return engine.secretWord;
            // Reveal spaces, mask characters
            return engine.secretWord.split('').map(c => c === ' ' ? '  ' : '_ ').join('');
        }
        if (engine.gameState === 'REVEAL') {
            return engine.secretWord;
        }
        return '---';
    }, [engine.gameState, engine.secretWord, isMeDrawer]);

    // Bot Simulation for Solo Testing
    const handleAddBot = () => {
        const botNames = ['CyberBot_9000', 'VectorAI', 'NeuralDoodle', 'QuantumBot'];
        const botName = botNames[Math.floor(Math.random() * botNames.length)] + '_' + Math.floor(Math.random() * 99);
        const botId = 'bot_' + Date.now();
        engine.peers.set(botId, {
            id: botId,
            username: botName,
            score: Math.floor(Math.random() * 150),
            hasGuessed: false,
            color: '#10b981',
            avatar: '🤖'
        });
        engine.syncGameState();
        forceRerender();
    };

    // Update Profile Name
    const handleUpdateName = (e) => {
        e.preventDefault();
        if (!customNameInput.trim()) return;
        setUsername(customNameInput);
        engine.username = customNameInput;
        const self = engine.peers.get(userId);
        if (self) self.username = customNameInput;
        sessionStorage.setItem('wb_username', customNameInput);
        engine.announcePresence();
        setShowSettings(false);
        forceRerender();
    };

    return (
        <div className="w-full h-full flex flex-col justify-between p-3 md:p-5 relative select-none">
            
            {/* 1. TOP TELEMETRY HUD */}
            <header className="w-full max-w-6xl mx-auto glass-card rounded-2xl p-3 md:px-6 md:py-3.5 flex justify-between items-center z-40">
                <div className="flex items-center gap-3">
                    <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-cyber-accent to-cyber-purple flex items-center justify-center font-bold text-cyber-950 shadow-lg glow-sky">
                        <span className="material-symbols-outlined text-2xl">palette</span>
                    </div>
                    <div>
                        <div className="flex items-center gap-2">
                            <h1 className="text-sm md:text-base font-extrabold tracking-wider text-sky-400 font-mono uppercase">WHITEBOARD_ARENA</h1>
                            <span className="bg-sky-500/20 text-sky-300 border border-sky-500/30 text-[10px] px-2 py-0.5 rounded-full font-mono font-bold">C¹ SPLINES</span>
                        </div>
                        <p className="text-[11px] text-slate-400 font-mono hidden sm:block">DUAL-CANVAS VECTOR PIPELINE // RDP SIMPLIFICATION</p>
                    </div>
                </div>

                {/* Word Display & Category Hint */}
                <div className="flex flex-col items-center justify-center">
                    <div className="flex items-center gap-2">
                        <span className="text-[10px] uppercase font-mono tracking-widest text-slate-400 font-bold">
                            {engine.gameState === 'DRAWING' ? `HINT: ${engine.secretCategory || 'OBJECT'}` : 'SECRET WORD'}
                        </span>
                        {engine.gameState === 'DRAWING' && isMeDrawer && (
                            <span className="bg-amber-500/20 text-amber-300 border border-amber-500/30 text-[9px] px-1.5 py-0.2 rounded font-mono font-bold">YOU'RE DRAWING</span>
                        )}
                    </div>
                    <div className="text-base md:text-2xl font-black font-mono tracking-widest text-amber-400 drop-shadow-[0_0_12px_rgba(245,158,11,0.4)]">
                        {wordDisplay}
                    </div>
                </div>

                {/* Round State & Countdown Timer */}
                <div className="flex items-center gap-3 md:gap-5">
                    {/* Timer Clock */}
                    <div className="flex items-center gap-2 bg-slate-900/80 px-3 py-1.5 rounded-xl border border-slate-700">
                        <span className={`material-symbols-outlined text-lg ${engine.roundTimer <= 10 && engine.gameState === 'DRAWING' ? 'text-rose-400 animate-pulse' : 'text-emerald-400'}`}>
                            schedule
                        </span>
                        <span className={`font-mono text-sm md:text-base font-bold ${engine.roundTimer <= 10 && engine.gameState === 'DRAWING' ? 'text-rose-400 animate-pulse' : 'text-emerald-400'}`}>
                            {engine.gameState === 'DRAWING' ? `${engine.roundTimer}s` : '--'}
                        </span>
                    </div>

                    {/* Sound Mute Toggle */}
                    <button
                        onClick={() => {
                            const next = !isMuted;
                            setIsMuted(next);
                            audioFX.muted = next;
                        }}
                        title={isMuted ? 'Unmute Audio FX' : 'Mute Audio FX'}
                        className="p-2 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-white transition-all border border-slate-700"
                    >
                        <span className="material-symbols-outlined text-lg">{isMuted ? 'volume_off' : 'volume_up'}</span>
                    </button>

                    {/* Settings Modal Toggle */}
                    <button
                        onClick={() => setShowSettings(!showSettings)}
                        className="p-2 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-white transition-all border border-slate-700"
                        title="User Settings & Multi-tab Guide"
                    >
                        <span className="material-symbols-outlined text-lg">settings</span>
                    </button>
                </div>
            </header>

            {/* 2. MAIN INTERACTIVE STAGE & CHAT CONTAINER */}
            <main className="w-full max-w-6xl mx-auto flex-1 flex flex-col lg:flex-row gap-4 items-center justify-center my-2 relative z-30 min-h-0">
                
                {/* DUAL-CANVAS DRAWING VIEWPORT */}
                <div className="relative w-full max-w-[800px] h-[340px] sm:h-[440px] md:h-[520px] rounded-2xl overflow-hidden border-2 border-slate-700 bg-white shadow-2xl flex-shrink-0">
                    
                    {/* Layer 2: Static Committed Stroke Buffer */}
                    <canvas
                        ref={committedCanvasRef}
                        width={800}
                        height={520}
                        className="absolute top-0 left-0 w-full h-full"
                    />

                    {/* Layer 1: Active In-Flight Stroke & Ghost Overlay */}
                    <canvas
                        ref={activeCanvasRef}
                        width={800}
                        height={520}
                        onPointerDown={handlePointerDown}
                        onPointerMove={handlePointerMove}
                        onPointerUp={handlePointerUp}
                        onPointerLeave={handlePointerUp}
                        className={`absolute top-0 left-0 w-full h-full ${
                            engine.gameState === 'DRAWING' && !isMeDrawer
                                ? 'cursor-not-allowed'
                                : isEraser
                                ? 'cursor-cell'
                                : 'cursor-crosshair'
                        }`}
                    />

                    {/* Non-Drawer Waiting Banner Overlay */}
                    {engine.gameState === 'DRAWING' && !isMeDrawer && (
                        <div className="absolute top-3 left-3 pointer-events-none bg-slate-950/70 backdrop-blur-md border border-slate-700 px-3 py-1.5 rounded-lg text-xs font-mono text-slate-300 flex items-center gap-2">
                            <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                            <span>Guessing Mode: Watch live vector stream</span>
                        </div>
                    )}

                    {/* Word Selection Modal Overlay */}
                    {engine.gameState === 'SELECTING_WORD' && (
                        <div className="absolute inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 z-40 animate-float-in">
                            {isMeDrawer ? (
                                <div className="glass-card p-6 rounded-2xl max-w-md w-full text-center border-sky-400/40 glow-sky">
                                    <span className="text-3xl">🎨</span>
                                    <h2 className="text-lg font-black font-mono text-sky-400 uppercase mt-2">Choose Your Word</h2>
                                    <p className="text-xs text-slate-300 mb-5">Select a secret subject to draw for other players:</p>
                                    <div className="grid grid-cols-1 gap-2.5">
                                        {engine.currentChoices.map((choice) => (
                                            <button
                                                key={choice.word}
                                                onClick={() => engine.selectWord(choice)}
                                                className="px-4 py-3 bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-400 hover:to-blue-500 text-slate-950 font-black font-mono rounded-xl text-sm uppercase shadow-lg transition-all transform hover:-translate-y-0.5 active:scale-95 flex items-center justify-between"
                                            >
                                                <span>{choice.word}</span>
                                                <span className="text-[10px] bg-slate-950/30 text-white px-2 py-0.5 rounded-md font-sans font-normal">{choice.category}</span>
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            ) : (
                                <div className="glass-card p-6 rounded-2xl max-w-sm w-full text-center border-slate-700">
                                    <div className="w-12 h-12 rounded-full bg-sky-500/20 text-sky-400 flex items-center justify-center mx-auto mb-3 animate-spin">
                                        <span className="material-symbols-outlined text-2xl">hourglass_top</span>
                                    </div>
                                    <h3 className="text-sm font-bold font-mono text-slate-200 uppercase">Artist is Choosing...</h3>
                                    <p className="text-xs text-slate-400 mt-1">Get ready to guess the incoming vector drawings!</p>
                                </div>
                            )}
                        </div>
                    )}

                    {/* Round Resolution / Score Splat Modal */}
                    {engine.gameState === 'REVEAL' && (
                        <div className="absolute inset-0 bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4 z-40 animate-float-in">
                            <div className="glass-card p-6 rounded-2xl max-w-md w-full text-center border-amber-400/40">
                                <span className="text-4xl">🏆</span>
                                <h2 className="text-sm font-bold font-mono text-slate-400 uppercase mt-2">Round Over</h2>
                                <p className="text-xs text-slate-300">The secret word was:</p>
                                <div className="text-3xl font-black font-mono text-amber-400 tracking-widest my-2">
                                    {engine.secretWord}
                                </div>
                                <p className="text-[11px] text-slate-400 font-mono mt-3">Next artist selection in 5s...</p>
                            </div>
                        </div>
                    )}

                    {/* Lobby Ready State */}
                    {engine.gameState === 'LOBBY' && (
                        <div className="absolute inset-0 bg-slate-950/75 backdrop-blur-sm flex items-center justify-center p-4 z-40">
                            <div className="glass-card p-6 rounded-2xl max-w-md w-full text-center border-emerald-400/30 glow-emerald">
                                <span className="text-4xl">🚀</span>
                                <h2 className="text-base font-extrabold font-mono text-emerald-400 uppercase mt-2">Whiteboard Arena Ready</h2>
                                <p className="text-xs text-slate-300 mt-1 mb-4">
                                    Connect 2+ browser tabs to start competitive multiplayer drawing, or start match now!
                                </p>
                                <div className="flex gap-2 justify-center">
                                    <button
                                        onClick={() => engine.startNewGame()}
                                        className="px-5 py-2.5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black font-mono rounded-xl text-xs uppercase shadow-lg transition-all transform hover:scale-105 active:scale-95 flex items-center gap-2"
                                    >
                                        <span className="material-symbols-outlined text-sm">play_arrow</span>
                                        Start Match
                                    </button>
                                    <button
                                        onClick={handleAddBot}
                                        className="px-4 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold font-mono rounded-xl text-xs uppercase transition-all border border-slate-700 flex items-center gap-1.5"
                                    >
                                        <span className="material-symbols-outlined text-sm">smart_toy</span>
                                        + Mock Player
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>

                {/* SIDEBAR: LEADERBOARD & GUESS CHATTER */}
                <div className="w-full lg:w-80 h-[320px] sm:h-[400px] md:h-[520px] glass-card rounded-2xl p-4 flex flex-col justify-between flex-shrink-0 z-30">
                    
                    {/* Live Scoreboard */}
                    <div>
                        <div className="flex justify-between items-center border-b border-slate-800 pb-2">
                            <span className="text-[11px] font-mono font-bold text-sky-400 uppercase tracking-wider flex items-center gap-1.5">
                                <span className="material-symbols-outlined text-sm">leaderboard</span>
                                Leaderboard ({peerList.length})
                            </span>
                            <span className="text-[10px] text-slate-500 font-mono">Real-Time</span>
                        </div>
                        
                        <div className="space-y-1.5 mt-2 max-h-32 overflow-y-auto custom-scrollbar pr-1">
                            {peerList.map((p, idx) => (
                                <div
                                    key={p.id}
                                    className={`flex justify-between items-center px-2.5 py-1.5 rounded-lg text-xs font-mono transition-all ${
                                        p.id === userId
                                            ? 'bg-sky-500/15 border border-sky-500/30 text-sky-300 font-bold'
                                            : 'bg-slate-900/60 border border-slate-800 text-slate-300'
                                    }`}
                                >
                                    <div className="flex items-center gap-2 truncate">
                                        <span className="text-[10px] text-slate-500 font-bold w-3">{idx + 1}.</span>
                                        <span className="truncate">{p.username}</span>
                                        {p.id === engine.currentDrawerId && (
                                            <span title="Current Artist" className="text-amber-400 text-xs">🎨</span>
                                        )}
                                        {p.hasGuessed && (
                                            <span title="Guessed Word" className="text-emerald-400 text-xs">✓</span>
                                        )}
                                    </div>
                                    <strong className="text-emerald-400 font-bold ml-2">{p.score}p</strong>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* Chat Messages Stream */}
                    <div className="flex-1 overflow-y-auto space-y-2 py-3 text-xs font-mono custom-scrollbar pr-1 my-1">
                        {messages.map((m) => (
                            <div
                                key={m.id}
                                className={`p-2 rounded-lg leading-relaxed text-[11px] break-words ${
                                    m.isCorrect
                                        ? 'bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 font-bold'
                                        : m.isClose
                                        ? 'bg-amber-500/20 border border-amber-500/40 text-amber-300 font-semibold'
                                        : m.isSystem
                                        ? 'bg-slate-900/80 border border-slate-800 text-slate-400 italic'
                                        : m.isDrawer
                                        ? 'bg-purple-900/30 border border-purple-500/30 text-purple-200'
                                        : 'bg-slate-900/50 border border-slate-800/80 text-slate-200'
                                }`}
                            >
                                {!m.isSystem && (
                                    <span className="text-sky-400 font-bold mr-1.5">
                                        {m.user}:
                                    </span>
                                )}
                                <span>{m.text}</span>
                            </div>
                        ))}
                        <div ref={messagesEndRef} />
                    </div>

                    {/* Guess Submission Form */}
                    <form onSubmit={handleChatSubmit} className="mt-1 flex gap-2">
                        <input
                            type="text"
                            placeholder={
                                isMeDrawer
                                    ? "You are drawing (Chat enabled)..."
                                    : "Type your word guess..."
                            }
                            value={chatInput}
                            onChange={(e) => setChatInput(e.target.value)}
                            className="flex-1 bg-slate-950 text-white px-3 py-2 rounded-xl border border-slate-700 text-xs font-mono focus:outline-none focus:border-sky-400 transition-all placeholder:text-slate-500"
                        />
                        <button
                            type="submit"
                            className="bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold font-mono px-3.5 py-2 rounded-xl text-xs uppercase transition-all shadow-md active:scale-95 flex items-center justify-center"
                        >
                            <span className="material-symbols-outlined text-base">send</span>
                        </button>
                    </form>
                </div>
            </main>

            {/* 3. BOTTOM ARTIST TOOLBAR CONTROLS */}
            <footer className="w-full max-w-6xl mx-auto glass-card rounded-2xl p-2.5 md:px-5 md:py-3 flex flex-wrap gap-3 justify-between items-center z-40">
                
                {/* Palette Colors */}
                <div className="flex items-center gap-1.5 overflow-x-auto py-1">
                    {COLOR_PALETTE.map(item => (
                        <button
                            key={item.hex}
                            onClick={() => {
                                setSelectedColor(item.hex);
                                engine.brushColor = item.hex;
                                engine.isEraser = false;
                                setIsEraser(false);
                            }}
                            title={item.name}
                            style={{ backgroundColor: item.hex }}
                            className={`w-6 h-6 md:w-7 md:h-7 rounded-full border-2 transition-all transform ${
                                selectedColor === item.hex && !isEraser
                                    ? 'border-white scale-110 shadow-lg glow-sky'
                                    : 'border-slate-700 hover:scale-105'
                            }`}
                        />
                    ))}
                </div>

                {/* Brush Sizes */}
                <div className="flex items-center gap-1 bg-slate-900/80 p-1 rounded-xl border border-slate-700">
                    {BRUSH_SIZES.map(item => (
                        <button
                            key={item.size}
                            onClick={() => {
                                setBrushSize(item.size);
                                engine.brushSize = item.size;
                            }}
                            title={`${item.label} (${item.size}px)`}
                            className={`px-2.5 py-1 rounded-lg text-xs font-mono font-bold transition-all flex items-center gap-1 ${
                                brushSize === item.size
                                    ? 'bg-sky-500 text-slate-950 shadow-md'
                                    : 'text-slate-400 hover:text-white hover:bg-slate-800'
                            }`}
                        >
                            <span className="material-symbols-outlined text-sm">{item.icon}</span>
                            <span className="hidden sm:inline">{item.size}px</span>
                        </button>
                    ))}
                </div>

                {/* Drawing Actions */}
                <div className="flex items-center gap-2">
                    {/* Eraser Tool */}
                    <button
                        onClick={() => {
                            const next = !isEraser;
                            setIsEraser(next);
                            engine.isEraser = next;
                        }}
                        className={`px-3 py-1.5 rounded-xl text-xs font-mono font-bold transition-all border flex items-center gap-1 ${
                            isEraser
                                ? 'bg-amber-500 text-slate-950 border-amber-400 shadow-md'
                                : 'bg-slate-800 text-slate-300 border-slate-700 hover:text-white'
                        }`}
                    >
                        <span className="material-symbols-outlined text-base">ink_eraser</span>
                        <span>Eraser</span>
                    </button>

                    {/* Undo Stroke */}
                    <button
                        onClick={() => engine.undoLastStroke()}
                        title="Undo Last Stroke"
                        className="px-3 py-1.5 rounded-xl text-xs font-mono font-bold bg-slate-800 text-slate-300 border border-slate-700 hover:text-white hover:bg-slate-700 transition-all flex items-center gap-1"
                    >
                        <span className="material-symbols-outlined text-base">undo</span>
                        <span className="hidden sm:inline">Undo</span>
                    </button>

                    {/* Clear Board */}
                    <button
                        onClick={() => engine.clearBoard()}
                        className="px-3 py-1.5 rounded-xl text-xs font-mono font-bold bg-rose-600/80 hover:bg-rose-500 text-white transition-all shadow-md flex items-center gap-1"
                    >
                        <span className="material-symbols-outlined text-base">delete</span>
                        <span className="hidden sm:inline">Clear</span>
                    </button>
                </div>
            </footer>

            {/* 4. SETTINGS & MULTI-TAB GUIDE MODAL */}
            {showSettings && (
                <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 z-50 animate-float-in">
                    <div className="glass-card p-6 rounded-2xl max-w-lg w-full border-sky-400/40 shadow-2xl relative">
                        <button
                            onClick={() => setShowSettings(false)}
                            className="absolute top-4 right-4 text-slate-400 hover:text-white transition-colors"
                        >
                            <span className="material-symbols-outlined">close</span>
                        </button>
                        
                        <div className="flex items-center gap-2 mb-4">
                            <span className="material-symbols-outlined text-sky-400 text-2xl">tune</span>
                            <h2 className="text-base font-bold font-mono text-white uppercase">Player Profile & Architecture</h2>
                        </div>

                        <form onSubmit={handleUpdateName} className="space-y-4">
                            <div>
                                <label className="text-xs font-mono text-slate-400 block mb-1">Your Display Name</label>
                                <div className="flex gap-2">
                                    <input
                                        type="text"
                                        value={customNameInput}
                                        onChange={(e) => setCustomNameInput(e.target.value)}
                                        className="flex-1 bg-slate-950 text-white px-3 py-2 rounded-xl border border-slate-700 text-xs font-mono focus:border-sky-400 focus:outline-none"
                                    />
                                    <button
                                        type="submit"
                                        className="bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold font-mono px-4 py-2 rounded-xl text-xs uppercase"
                                    >
                                        Save
                                    </button>
                                </div>
                            </div>
                        </form>

                        <div className="mt-6 pt-4 border-t border-slate-800 space-y-2 text-xs font-mono text-slate-300">
                            <h3 className="text-sky-400 font-bold uppercase text-[11px]">How Multi-Tab Sync Works:</h3>
                            <ul className="list-disc list-inside space-y-1 text-slate-400 text-[11px]">
                                <li>Open this page in <strong>2 or more separate browser tabs</strong>.</li>
                                <li>Draw in one tab to stream Midpoint Bézier vector splines.</li>
                                <li>Type guesses in another tab to test Levenshtein fuzzy match hints.</li>
                                <li>All synchronization runs over zero-latency local <code className="text-sky-300">BroadcastChannel</code> bus.</li>
                            </ul>
                        </div>
                    </div>
                </div>
            )}
        </div>
    );
}

// Mount the React Application
const rootElement = document.getElementById('root');
if (rootElement) {
    ReactDOM.createRoot(rootElement).render(<SharedWhiteboardApp />);
}
</script>
</body>
</html>
