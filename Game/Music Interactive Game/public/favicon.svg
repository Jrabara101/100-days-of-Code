<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#06b6d4" flood-opacity="0.8"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="#030712" />
  <rect x="2" y="2" width="60" height="60" rx="12" stroke="url(#cyber-grad)" stroke-width="2" />
  <!-- Waveform bars -->
  <g filter="url(#glow)">
    <line x1="14" y1="36" x2="14" y2="28" stroke="#06b6d4" stroke-width="4" stroke-linecap="round" />
    <line x1="23" y1="44" x2="23" y2="20" stroke="#06b6d4" stroke-width="4" stroke-linecap="round" />
    <line x1="32" y1="48" x2="32" y2="16" stroke="#6366f1" stroke-width="4" stroke-linecap="round" />
    <line x1="41" y1="42" x2="41" y2="22" stroke="#ec4899" stroke-width="4" stroke-linecap="round" />
    <line x1="50" y1="35" x2="50" y2="29" stroke="#f43f5e" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
