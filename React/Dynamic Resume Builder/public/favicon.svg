<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1c1b1d"/>
      <stop offset="100%" stop-color="#0e0e10"/>
    </linearGradient>
    <linearGradient id="accent" x1="6" y1="6" x2="26" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c0c1ff"/>
      <stop offset="100%" stop-color="#494bd6"/>
    </linearGradient>
    <linearGradient id="spark" x1="16" y1="6" x2="26" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6ffbbe"/>
      <stop offset="100%" stop-color="#4edea3"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" stroke="#464554" stroke-opacity="0.4"/>
  <!-- Layer 1 (Back document) -->
  <rect x="7" y="5" width="14" height="18" rx="2" fill="#353437" opacity="0.6"/>
  <!-- Layer 2 (Main document) -->
  <rect x="10" y="8" width="15" height="19" rx="2.5" fill="#201f22" stroke="url(#accent)" stroke-width="1.2"/>
  <!-- Document lines -->
  <rect x="13" y="12" width="6" height="2" rx="1" fill="url(#accent)"/>
  <rect x="13" y="16" width="9" height="1.5" rx="0.75" fill="#c7c4d7" opacity="0.8"/>
  <rect x="13" y="19" width="9" height="1.5" rx="0.75" fill="#c7c4d7" opacity="0.8"/>
  <rect x="13" y="22" width="6" height="1.5" rx="0.75" fill="#c7c4d7" opacity="0.5"/>
  <!-- Spatial Accent / ATS verified spark dot -->
  <circle cx="23" cy="9" r="2.5" fill="url(#spark)"/>
</svg>
